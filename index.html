<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡路里计算器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 20px 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Search */
    .search-box {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input[type="text"] {
      flex: 1;
      border: 1.5px solid #dde3ec;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-row input[type="text"]:focus { border-color: #ff6b35; }
    .search-row button {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .search-row button:hover { background: #e55a28; }

    /* Results */
    #results {
      margin-top: 12px;
      display: none;
    }
    #results.show { display: block; }
    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #f0f0f0;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #fff4ef; }
    .result-item .food-name { font-weight: 500; }
    .result-item .food-meta { font-size: 0.82rem; color: #888; }
    .result-item .food-cal {
      font-weight: 700;
      color: #ff6b35;
      font-size: 0.95rem;
      white-space: nowrap;
      margin-left: 12px;
    }
    .result-item .add-btn {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.2s;
    }
    .result-item .add-btn:hover { background: #e55a28; }
    .no-result { color: #999; font-size: 0.9rem; padding: 10px 14px; }

    /* Amount modal row (inline) */
    .amount-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 10px 14px;
      background: #fff8f5;
      border-radius: 8px;
      border: 1.5px solid #ffd5c2;
      flex-wrap: wrap;
    }
    .amount-row label { font-size: 0.88rem; color: #555; }
    .amount-row input[type="number"] {
      width: 80px;
      border: 1.5px solid #dde3ec;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .amount-row input[type="number"]:focus { border-color: #ff6b35; }
    .amount-row .unit-label { font-size: 0.88rem; color: #777; }
    .amount-row .confirm-btn {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .amount-row .confirm-btn:hover { background: #e55a28; }
    .amount-row .cancel-btn {
      background: #eee;
      color: #666;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .amount-row .preview-cal { font-size: 0.88rem; color: #ff6b35; font-weight: 600; }

    /* Categories */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: white;
      border: 1.5px solid #dde3ec;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #ff6b35;
      border-color: #ff6b35;
      color: white;
    }

    /* Meal list */
    .meal-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .meal-card-header {
      background: #fff4ef;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ffe8da;
    }
    .meal-card-header h3 { font-size: 0.95rem; color: #d44f1a; }
    .meal-card-header .meal-total {
      font-weight: 700;
      color: #ff6b35;
    }
    .meal-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #f5f5f5;
      gap: 10px;
    }
    .meal-item:last-child { border-bottom: none; }
    .meal-item .item-name { flex: 1; font-size: 0.92rem; }
    .meal-item .item-amount { font-size: 0.82rem; color: #999; }
    .meal-item .item-cal { font-weight: 600; color: #ff6b35; font-size: 0.92rem; white-space: nowrap; }
    .meal-item .del-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      line-height: 1;
      transition: color 0.2s;
    }
    .meal-item .del-btn:hover { color: #e74c3c; }

    /* Total */
    .total-card {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      border-radius: 12px;
      padding: 20px 24px;
      color: white;
      text-align: center;
      box-shadow: 0 4px 16px rgba(255,107,53,0.35);
      margin-bottom: 16px;
    }
    .total-card .total-label { font-size: 0.9rem; opacity: 0.9; }
    .total-card .total-num { font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin: 4px 0; }
    .total-card .total-unit { font-size: 1rem; opacity: 0.85; }
    .total-card .clear-btn {
      margin-top: 12px;
      background: rgba(255,255,255,0.25);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .total-card .clear-btn:hover { background: rgba(255,255,255,0.4); }
    .empty-hint {
      text-align: center;
      color: #bbb;
      font-size: 0.88rem;
      padding: 30px 0;
    }

    /* Tags for quick add */
    .quick-section { margin-bottom: 16px; }
    .quick-section h4 { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-tag {
      background: white;
      border: 1.5px solid #dde3ec;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }
    .quick-tag:hover { border-color: #ff6b35; color: #ff6b35; }
    .quick-tag span { color: #ff6b35; font-weight: 600; margin-left: 4px; }
  </style>
</head>
<body>
<header>
  <h1>🔥 卡路里计算器</h1>
  <p>搜索食物，快速累加每日热量摄入</p>
</header>

<div class="container">
  <!-- Total -->
  <div class="total-card">
    <div class="total-label">今日总热量</div>
    <div class="total-num" id="totalCal">0</div>
    <div class="total-unit">卡路里 (kcal)</div>
    <button class="clear-btn" onclick="clearAll()">清空记录</button>
  </div>

  <!-- Search -->
  <div class="search-box">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索食物，如：米饭、苹果、鸡胸肉..." />
      <button onclick="doSearch()">搜索</button>
    </div>
    <div id="results"></div>
    <div id="amountBox"></div>
  </div>

  <!-- Categories -->
  <div class="categories" id="catBar"></div>

  <!-- Quick add tags -->
  <div class="quick-section">
    <h4>常用食物快速添加（默认份量）</h4>
    <div class="quick-tags" id="quickTags"></div>
  </div>

  <!-- Meal list -->
  <div id="mealList"></div>
</div>

  { name:"炒饭",       cal:182,  unit:100, unitLabel:"g",  cat:"快餐", defaultG:250 },
  { name:"宫保鸡丁",   cal:165,  unit:100, unitLabel:"g",  cat:"快餐", defaultG:200 },
  { name:"红烧肉",     cal:476,  unit:100, unitLabel:"g",  cat:"快餐", defaultG:150 },
  { name:"麻辣烫（碗）",cal:150, unit:100, unitLabel:"g",  cat:"快餐", defaultG:400 },

const CATS = ["全部", ...new Set(FOODS.map(f => f.cat))];

// ─── State ───────────────────────────────────────────────────────────────────
let items = []; // { id, name, grams, kcal }
let pendingFood = null;

// ─── Init ────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  renderCats();
  renderQuickTags();
  renderMeal();

  const inp = document.getElementById("searchInput");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
  inp.addEventListener("input", () => { if (!inp.value.trim()) hideResults(); });
});

// ─── Categories ──────────────────────────────────────────────────────────────
let activeCat = "全部";
function renderCats() {
  const bar = document.getElementById("catBar");
  bar.innerHTML = CATS.map(c =>
    `<button class="cat-btn${c===activeCat?' active':''}" onclick="selectCat('${c}')">${c}</button>`
  ).join("");
}
function selectCat(cat) {
  activeCat = cat;
  renderCats();
  doSearch();
}

// ─── Quick Tags ───────────────────────────────────────────────────────────────
function renderQuickTags() {
  const popular = ["白米饭","鸡胸肉（熟）","鸡蛋","苹果","全脂牛奶","西兰花","香蕉","白馒头","豆腐（嫩）","咖啡（黑）"];
  const container = document.getElementById("quickTags");
  container.innerHTML = popular.map(name => {
    const f = FOODS.find(x => x.name === name);
    if (!f) return "";
    const kcal = Math.round(f.cal * f.defaultG / 100);
    return `<button class="quick-tag" onclick="quickAdd('${f.name}')">${f.name}<span>${kcal}kcal</span></button>`;
  }).join("");
}
function quickAdd(name) {
  const f = FOODS.find(x => x.name === name);
  if (!f) return;
  addItem(f, f.defaultG);
}

// ─── Search ───────────────────────────────────────────────────────────────────
function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  const resultsDiv = document.getElementById("results");
  closeAmountBox();

  let list = FOODS;
  if (activeCat !== "全部") list = list.filter(f => f.cat === activeCat);
  if (q) list = list.filter(f => f.name.toLowerCase().includes(q.toLowerCase()));

  resultsDiv.classList.add("show");
  if (list.length === 0) {
    resultsDiv.innerHTML = `<div class="no-result">未找到"${q}"，试试其他关键词</div>`;
    return;
  }
  resultsDiv.innerHTML = list.slice(0, 20).map((f, i) => {
    const calPer = `${f.cal} kcal/100${f.unitLabel}`;
    return `
      <div class="result-item" id="ri_${i}">
        <div>
          <div class="food-name">${f.name}</div>
          <div class="food-meta">${f.cat} · ${calPer}</div>
        </div>
        <div style="display:flex;align-items:center">
          <div class="food-cal">${f.cal}<small style="font-size:0.7em;font-weight:400">/100g</small></div>
          <button class="add-btn" onclick="showAmountBox(${FOODS.indexOf(f)}, 'ri_${i}')">+ 添加</button>
        </div>
      </div>`;
  }).join("");
}
function hideResults() {
  document.getElementById("results").classList.remove("show");
  document.getElementById("results").innerHTML = "";
}

// ─── Amount Box ───────────────────────────────────────────────────────────────
function showAmountBox(foodIdx, rowId) {
  const f = FOODS[foodIdx];
  pendingFood = f;
  const box = document.getElementById("amountBox");
  box.innerHTML = `
    <div class="amount-row">
      <label>添加 <strong>${f.name}</strong>，份量：</label>
      <input type="number" id="gramInput" min="1" max="5000" value="${f.defaultG}" oninput="updatePreview(${foodIdx})" />
      <span class="unit-label">克 (g)</span>
      <span class="preview-cal" id="previewCal">${calcKcal(f, f.defaultG)} kcal</span>
      <button class="confirm-btn" onclick="confirmAdd(${foodIdx})">确认添加</button>
      <button class="cancel-btn" onclick="closeAmountBox()">取消</button>
    </div>`;
  document.getElementById("gramInput").focus();
  document.getElementById("gramInput").addEventListener("keydown", e => {
    if (e.key === "Enter") confirmAdd(foodIdx);
  });
}
function updatePreview(foodIdx) {
  const f = FOODS[foodIdx];
  const g = parseFloat(document.getElementById("gramInput").value) || 0;
  document.getElementById("previewCal").textContent = calcKcal(f, g) + " kcal";
}
function confirmAdd(foodIdx) {
  const f = FOODS[foodIdx];
  const g = parseFloat(document.getElementById("gramInput").value);
  if (!g || g <= 0) { alert("请输入有效克数"); return; }
  addItem(f, g);
  closeAmountBox();
}
function closeAmountBox() {
  document.getElementById("amountBox").innerHTML = "";
  pendingFood = null;
}

// ─── Items ────────────────────────────────────────────────────────────────────
function calcKcal(food, grams) {
  return Math.round(food.cal * grams / 100);
}
function addItem(food, grams) {
  items.push({
    id: Date.now() + Math.random(),
    name: food.name,
    grams,
    kcal: calcKcal(food, grams),
    cat: food.cat,
  });
  renderMeal();
}
function deleteItem(id) {
  items = items.filter(x => x.id !== id);
  renderMeal();
}
function clearAll() {
  if (items.length === 0) return;
  if (!confirm("确定清空所有记录？")) return;
  items = [];
  renderMeal();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderMeal() {
  const total = items.reduce((s, x) => s + x.kcal, 0);
  document.getElementById("totalCal").textContent = total.toLocaleString();

  const container = document.getElementById("mealList");
  if (items.length === 0) {
    container.innerHTML = `<div class="empty-hint">还没有添加食物，搜索或点击上方快速添加</div>`;
    return;
  }

  // Group by category
  const groups = {};
  items.forEach(it => {
    if (!groups[it.cat]) groups[it.cat] = [];
    groups[it.cat].push(it);
  });

  container.innerHTML = Object.entries(groups).map(([cat, list]) => {
    const groupTotal = list.reduce((s, x) => s + x.kcal, 0);
    const rows = list.map(it => `
      <div class="meal-item">
        <div class="item-name">${it.name}</div>
        <div class="item-amount">${it.grams}g</div>
        <div class="item-cal">${it.kcal} kcal</div>
        <button class="del-btn" onclick="deleteItem(${it.id})" title="删除">×</button>
      </div>`).join("");
    return `
      <div class="meal-card">
        <div class="meal-card-header">
          <h3>${cat}</h3>
          <span class="meal-total">${groupTotal} kcal</span>
        </div>
        ${rows}
      </div>`;
  }).join("");
}
</script>
</body>
</html>
