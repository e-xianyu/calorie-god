<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡路里计算器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 20px 24px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { font-size: 0.82rem; opacity: 0.88; margin-top: 4px; }

    /* API key bar */
    .apikey-bar {
      background: #fff8f2;
      border-bottom: 1px solid #fde8d8;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: #666;
    }
    .apikey-bar label { white-space: nowrap; }
    .apikey-bar input {
      border: 1.5px solid #dde3ec;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.82rem;
      width: 200px;
      outline: none;
    }
    .apikey-bar input:focus { border-color: #ff6b35; }
    .apikey-bar a {
      color: #ff6b35;
      text-decoration: none;
      white-space: nowrap;
    }
    .apikey-bar a:hover { text-decoration: underline; }
    .source-badge {
      margin-left: auto;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Total */
    .total-card {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      border-radius: 12px;
      padding: 20px 24px;
      color: white;
      text-align: center;
      box-shadow: 0 4px 16px rgba(255,107,53,0.35);
      margin-bottom: 16px;
    }
    .total-card .total-label { font-size: 0.9rem; opacity: 0.9; }
    .total-card .total-num { font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin: 4px 0; }
    .total-card .total-unit { font-size: 1rem; opacity: 0.85; }
    .total-card .clear-btn {
      margin-top: 12px;
      background: rgba(255,255,255,0.25);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .total-card .clear-btn:hover { background: rgba(255,255,255,0.4); }

    /* Search */
    .search-box {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input[type="text"] {
      flex: 1;
      border: 1.5px solid #dde3ec;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-row input[type="text"]:focus { border-color: #ff6b35; }
    .search-row button {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-row button:hover { background: #e55a28; }
    .search-row button:disabled { background: #ccc; cursor: not-allowed; }

    /* Data type filter */
    .dtype-filter {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .dtype-btn {
      background: #f5f5f5;
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }
    .dtype-btn.active {
      background: #fff4ef;
      border-color: #ff6b35;
      color: #ff6b35;
      font-weight: 600;
    }

    /* Results */
    #results {
      margin-top: 12px;
      display: none;
    }
    #results.show { display: block; }
    .result-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 10px 6px;
      border-radius: 8px;
      transition: background 0.15s;
      border-bottom: 1px solid #f0f0f0;
      gap: 8px;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #fff9f6; }
    .result-info { flex: 1; min-width: 0; }
    .result-item .food-name {
      font-weight: 500;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .result-item .food-meta {
      font-size: 0.78rem;
      color: #999;
      margin-top: 2px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .dtype-tag {
      background: #e8f0fe;
      color: #3f51b5;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .dtype-tag.branded { background: #fff3e0; color: #e65100; }
    .dtype-tag.foundation { background: #e8f5e9; color: #2e7d32; }
    .dtype-tag.srlegacy { background: #f3e5f5; color: #6a1b9a; }
    .result-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .result-item .food-cal {
      font-weight: 700;
      color: #ff6b35;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    .result-item .add-btn {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .result-item .add-btn:hover { background: #e55a28; }

    .no-result { color: #999; font-size: 0.9rem; padding: 12px 6px; }
    .loading {
      color: #ff6b35;
      font-size: 0.88rem;
      padding: 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #ffd5c2;
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Amount box */
    .amount-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 10px 12px;
      background: #fff8f5;
      border-radius: 8px;
      border: 1.5px solid #ffd5c2;
      flex-wrap: wrap;
    }
    .amount-row label { font-size: 0.88rem; color: #555; }
    .amount-row input[type="number"] {
      width: 80px;
      border: 1.5px solid #dde3ec;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .amount-row input[type="number"]:focus { border-color: #ff6b35; }
    .amount-row .preview-cal { font-size: 0.88rem; color: #ff6b35; font-weight: 600; }
    .amount-row .confirm-btn {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .amount-row .confirm-btn:hover { background: #e55a28; }
    .amount-row .cancel-btn {
      background: #eee;
      color: #666;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* Meal list */
    .section-title {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .meal-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .meal-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f5f5f5;
      gap: 8px;
    }
    .meal-item:last-child { border-bottom: none; }
    .meal-item .item-name { flex: 1; font-size: 0.9rem; min-width: 0; word-break: break-word; }
    .meal-item .item-amount { font-size: 0.8rem; color: #aaa; white-space: nowrap; }
    .meal-item .item-cal { font-weight: 600; color: #ff6b35; font-size: 0.9rem; white-space: nowrap; }
    .meal-item .del-btn {
      background: none;
      border: none;
      color: #ddd;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .meal-item .del-btn:hover { color: #e74c3c; }

    .empty-hint {
      text-align: center;
      color: #bbb;
      font-size: 0.88rem;
      padding: 30px 0;
    }

    /* Error */
    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      padding: 10px 6px;
      background: #fdf0ef;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<header>
  <h1>🔥 卡路里计算器</h1>
  <p>数据来源 USDA FoodData Central，真实权威</p>
</header>

<!-- API Key bar -->
<div class="apikey-bar">
  <label for="apiKeyInput">API Key:</label>
  <input type="text" id="apiKeyInput" value="DEMO_KEY" placeholder="DEMO_KEY" />
  <a href="https://fdc.nal.usda.gov/api-key-signup/" target="_blank" rel="noopener">免费申请正式 Key →</a>
  <span class="source-badge">✓ USDA FoodData Central</span>
</div>

<div class="container">
  <!-- Total -->
  <div class="total-card">
    <div class="total-label">今日总热量</div>
    <div class="total-num" id="totalCal">0</div>
    <div class="total-unit">卡路里 (kcal)</div>
    <button class="clear-btn" onclick="clearAll()">清空记录</button>
  </div>

  <!-- Search -->
  <div class="search-box">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索食物（英文效果更好），如：apple, chicken breast, rice..." />
      <button id="searchBtn" onclick="doSearch()">
        <span id="searchBtnText">搜索</span>
      </button>
    </div>

    <!-- Data type filter -->
    <div class="dtype-filter">
      <span style="font-size:0.78rem;color:#aaa;align-self:center">数据类型：</span>
      <button class="dtype-btn active" data-dtype="Foundation,SR Legacy,Survey (FNDDS),Branded" onclick="setDtype(this)">全部</button>
      <button class="dtype-btn" data-dtype="Foundation,SR Legacy" onclick="setDtype(this)">权威基础食材</button>
      <button class="dtype-btn" data-dtype="Branded" onclick="setDtype(this)">品牌商品</button>
    </div>

    <div id="results"></div>
    <div id="amountBox"></div>
  </div>

  <!-- Meal list -->
  <div class="section-title" id="listTitle" style="display:none">已添加食物</div>
  <div id="mealList">
    <div class="empty-hint">搜索食物后点击"+ 添加"，热量将自动累加</div>
  </div>
</div>

<script>
const USDA_BASE = "https://api.nal.usda.gov/fdc/v1";
let activeDataType = "Foundation,SR Legacy,Survey (FNDDS),Branded";
let searchResults = []; // cache current results for indexing
let items = [];
let searching = false;

// ─── Data type filter ────────────────────────────────────────────────────────
function setDtype(btn) {
  document.querySelectorAll(".dtype-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeDataType = btn.dataset.dtype;
}

// ─── API Key ─────────────────────────────────────────────────────────────────
function getApiKey() {
  return document.getElementById("apiKeyInput").value.trim() || "DEMO_KEY";
}

// ─── Search ───────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("searchInput");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
});

async function doSearch() {
  if (searching) return;
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;

  const resultsDiv = document.getElementById("results");
  closeAmountBox();
  searching = true;
  document.getElementById("searchBtn").disabled = true;
  document.getElementById("searchBtnText").textContent = "搜索中...";

  resultsDiv.classList.add("show");
  resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div>正在查询 USDA 数据库...</div>`;

  try {
    const url = new URL(`${USDA_BASE}/foods/search`);
    url.searchParams.set("query", q);
    url.searchParams.set("api_key", getApiKey());
    url.searchParams.set("pageSize", "20");
    url.searchParams.set("dataType", activeDataType);

    const res = await fetch(url.toString());
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    const data = await res.json();
    const foods = (data.foods || []).filter(f => getEnergyKcal(f) !== null);
    searchResults = foods;
    renderResults(foods, q);
  } catch (err) {
    resultsDiv.innerHTML = `<div class="error-msg">请求失败：${escHtml(err.message)}<br>请检查网络连接或 API Key 是否有效。</div>`;
  } finally {
    searching = false;
    document.getElementById("searchBtn").disabled = false;
    document.getElementById("searchBtnText").textContent = "搜索";
  }
}

function getEnergyKcal(food) {
  // In the search abridged response, foodNutrients is a flat array
  const nutrients = food.foodNutrients || [];
  // Try nutrientId 1008 (Energy, kcal)
  const n = nutrients.find(n =>
    (n.nutrientId === 1008 || n.nutrientId === 2047 || n.nutrientId === 2048) &&
    (n.unitName || "").toLowerCase() === "kcal"
  );
  if (n) return n.value ?? null;
  // Fallback: find by name
  const byName = nutrients.find(n =>
    typeof n.nutrientName === "string" &&
    n.nutrientName.toLowerCase().includes("energy") &&
    (n.unitName || "").toLowerCase() === "kcal"
  );
  return byName ? (byName.value ?? null) : null;
}

function dtypeClass(dataType) {
  if (!dataType) return "";
  const d = dataType.toLowerCase();
  if (d.includes("foundation")) return "foundation";
  if (d.includes("sr legacy")) return "srlegacy";
  if (d.includes("branded")) return "branded";
  return "";
}

function dtypeLabel(dataType) {
  if (!dataType) return "Unknown";
  if (dataType.includes("Foundation")) return "Foundation";
  if (dataType.includes("SR Legacy")) return "SR Legacy";
  if (dataType.includes("Survey")) return "Survey";
  if (dataType.includes("Branded")) return "Branded";
  return dataType;
}

function renderResults(foods, q) {
  const resultsDiv = document.getElementById("results");
  if (foods.length === 0) {
    resultsDiv.innerHTML = `<div class="no-result">未在 USDA 数据库中找到"${escHtml(q)}"的热量数据，换个词试试（建议用英文）。</div>`;
    return;
  }
  resultsDiv.innerHTML = foods.map((f, i) => {
    const kcal = getEnergyKcal(f);
    const brand = f.brandOwner ? `· ${f.brandOwner}` : "";
    const dc = dtypeClass(f.dataType);
    return `
      <div class="result-item">
        <div class="result-info">
          <div class="food-name">${escHtml(f.description)}</div>
          <div class="food-meta">
            <span class="dtype-tag ${dc}">${dtypeLabel(f.dataType)}</span>
            ${brand ? `<span>${escHtml(brand)}</span>` : ""}
          </div>
        </div>
        <div class="result-right">
          <div class="food-cal">${kcal}<small style="font-size:0.7em;font-weight:400"> kcal/100g</small></div>
          <button class="add-btn" onclick="showAmountBox(${i})">+ 添加</button>
        </div>
      </div>`;
  }).join("");
}

// ─── Amount Box ───────────────────────────────────────────────────────────────
function showAmountBox(idx) {
  const f = searchResults[idx];
  const kcalPer100 = getEnergyKcal(f);
  const box = document.getElementById("amountBox");
  box.innerHTML = `
    <div class="amount-row">
      <label>添加 <strong>${escHtml(f.description)}</strong></label>
      <input type="number" id="gramInput" min="1" max="5000" value="100"
             oninput="updatePreview(${kcalPer100})" />
      <span style="font-size:0.88rem;color:#777">克 (g)</span>
      <span class="preview-cal" id="previewCal">${kcalPer100} kcal</span>
      <button class="confirm-btn" onclick="confirmAdd(${idx})">确认添加</button>
      <button class="cancel-btn" onclick="closeAmountBox()">取消</button>
    </div>`;
  const inp = document.getElementById("gramInput");
  inp.focus();
  inp.select();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") confirmAdd(idx); });
}

function updatePreview(kcalPer100) {
  const g = parseFloat(document.getElementById("gramInput").value) || 0;
  document.getElementById("previewCal").textContent =
    Math.round(kcalPer100 * g / 100) + " kcal";
}

function confirmAdd(idx) {
  const f = searchResults[idx];
  const g = parseFloat(document.getElementById("gramInput").value);
  if (!g || g <= 0) { alert("请输入有效克数"); return; }
  const kcalPer100 = getEnergyKcal(f);
  addItem({
    name: f.description,
    dataType: f.dataType,
    kcalPer100,
    grams: g,
    kcal: Math.round(kcalPer100 * g / 100),
  });
  closeAmountBox();
}

function closeAmountBox() {
  document.getElementById("amountBox").innerHTML = "";
}

// ─── Items ────────────────────────────────────────────────────────────────────
function addItem(item) {
  items.push({ id: Date.now() + Math.random(), ...item });
  renderMeal();
}

function deleteItem(id) {
  items = items.filter(x => x.id !== id);
  renderMeal();
}

function clearAll() {
  if (items.length === 0) return;
  if (!confirm("确定清空所有记录？")) return;
  items = [];
  renderMeal();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderMeal() {
  const total = items.reduce((s, x) => s + x.kcal, 0);
  document.getElementById("totalCal").textContent = total.toLocaleString();
  document.getElementById("listTitle").style.display = items.length ? "" : "none";

  const container = document.getElementById("mealList");
  if (items.length === 0) {
    container.innerHTML = `<div class="empty-hint">搜索食物后点击"+ 添加"，热量将自动累加</div>`;
    return;
  }

  container.innerHTML = `<div class="meal-card">${
    items.map(it => `
      <div class="meal-item">
        <div class="item-name">${escHtml(it.name)}</div>
        <div class="item-amount">${it.grams}g</div>
        <div class="item-cal">${it.kcal} kcal</div>
        <button class="del-btn" onclick="deleteItem(${it.id})" title="删除">×</button>
      </div>`).join("")
  }</div>`;
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
</body>
</html>
